name: Check Links

on:
  pull_request:
    branches: [main]
    paths:
      - "interview-experiences/**/*.md"
      - "README.md"
  # Also run weekly to catch links that go dead over time
  schedule:
    - cron: "0 6 * * 1"

jobs:
  link-check:
    name: Verify URLs are reachable
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all markdown files in the repo
          args: >
            --verbose
            --no-progress
            --accept 200,206,429
            --exclude 'https://leetcode\.com'
            --exclude 'https://hackerrank\.com'
            --exclude 'https://naukri\.com'
            'interview-experiences/**/*.md'
            'README.md'
            'CONTRIBUTING.md'
          fail: true
